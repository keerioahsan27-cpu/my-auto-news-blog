name: Daily Auto News Update
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24'

    - name: Fetch Latest News and Build Page
      run: node fetch-news.js

    - name: Commit and Push changes
      run: |
        git config --global user.name "Auto News Bot"
        git config --global user.email "bot@autonews.com"
        git add index.html
        git commit -m "Automated Daily News Update [skip ci]" || exit 0
        git push origin main
